<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Modern ecommerce admin dashboard for managing products, orders and customers."
  />

  <meta name="theme-color" content="#111827" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <title>Admin Dashboard | Ecommerce</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Inter",sans-serif;
    }


    body{
      background:#f8fafc;
      color:#111827;
    }


    #root{
      min-height:100vh;
    }


    .dashboard{
      min-height:100vh;
      padding:30px;
      display:flex;
      gap:30px;
    }


    .sidebar{

      width:260px;
      background:#111827;
      color:white;
      padding:25px;
      border-radius:24px;
      box-shadow:0 15px 35px rgba(0,0,0,.15);

    }


    .sidebar h2{

      font-size:28px;
      margin-bottom:35px;
      font-weight:800;

    }


    .sidebar a{

      display:block;
      color:#d1d5db;
      padding:14px 15px;
      margin-bottom:12px;
      border-radius:12px;
      text-decoration:none;
      transition:.3s;

    }


    .sidebar a:hover{

      background:#2563eb;
      color:white;

    }



    .content{

      flex:1;

    }



    .header{

      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      margin-bottom:25px;

    }


    .header h1{

      font-size:32px;

    }



    .cards{

      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(220px,1fr));
      gap:25px;

    }



    .card{

      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:
      0 10px 25px rgba(0,0,0,.06);
      transition:.3s;

    }



    .card:hover{

      transform:translateY(-8px);

    }



    .card h3{

      color:#6b7280;
      font-size:15px;

    }



    .card p{

      font-size:32px;
      font-weight:800;
      margin-top:10px;

    }



    table{

      width:100%;
      margin-top:30px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      border-collapse:collapse;
      box-shadow:
      0 10px 25px rgba(0,0,0,.06);

    }



    th{

      background:#111827;
      color:white;
      padding:16px;
      text-align:left;

    }



    td{

      padding:16px;
      border-bottom:1px solid #e5e7eb;

    }



    tr:hover{

      background:#f8fafc;

    }



    button{

      background:#2563eb;
      color:white;
      border:none;
      padding:12px 22px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
      transition:.3s;

    }



    button:hover{

      background:#1d4ed8;

    }



    input{

      width:100%;
      padding:14px 18px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      outline:none;

    }



    input:focus{

      border-color:#2563eb;

    }



    @media(max-width:768px){

      .dashboard{

        flex-direction:column;
        padding:15px;

      }


      .sidebar{

        width:100%;

      }


      .header h1{

        font-size:24px;

      }

    }

  </style>

</head>


<body>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
